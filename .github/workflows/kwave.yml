# KWAVE Link fork CI — builds the OpenClaw template image and pushes
# to Fly's internal registry. New machines spawned by KWAVE Link's
# companion (kwaveai/kwave-link → chatmachine Fly app) pull the
# :latest tag at workspace creation time.
#
# Pattern mirrors swiriwon/OAL-chat's `openagentlink-build` workflow:
#   - per-customer template image, not a single shared service
#   - pushed to registry.fly.io/chatmachine:latest
#   - one less external secret to manage in the Fly env (FLY_API_TOKEN
#     stays inside Fly's auth scope)
#
# The `chatmachine` Fly app holds the registry slot only — it is not
# runnable on its own. Per-company machines that KWAVE Link spawns
# reference `image: registry.fly.io/chatmachine:latest`.
#
# Trigger: push to the `kwave` branch. The default `main` branch tracks
# upstream openclaw and intentionally has no CI of its own (all upstream
# workflows are disabled on this fork to silence the inherited noise).

name: kwave-build

on:
  push:
    branches:
      - kwave
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and push to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app chatmachine \
            --image-label latest \
            --build-only \
            --push \
            --remote-only
